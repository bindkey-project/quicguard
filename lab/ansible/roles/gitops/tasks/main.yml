- name: Install git and ansible
  ansible.builtin.dnf:
    name:
      - git
      - ansible
    state: present

- name: Install gitops systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - qg-gitops.service
    - qg-gitops.timer

- name: Enable gitops timer
  ansible.builtin.systemd:
    name: qg-gitops.timer
    enabled: true
    state: started
    daemon_reload: true